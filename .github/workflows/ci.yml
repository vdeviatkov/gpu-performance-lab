name: CPU validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'jax>=0.5,<1'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m 'not gpu' -q
      - run: cmake -S . -B build-cpu && cmake --build build-cpu
      - run: python -m build
      - run: python -m benchmarks.run_all --device cpu --kernel vector_add --shape 17 --implementations pytorch jax --dtypes fp32 --warmup 1 --repetitions 3 --require-all --output artifacts/ci-smoke.json
      - run: python -m benchmarks.report artifacts/ci-smoke.json --output artifacts/ci-smoke.md
  cpp-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install clang-format==21.1.3
      - run: find common kernels -type f \( -name '*.cu' -o -name '*.cuh' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
