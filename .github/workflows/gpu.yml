name: Manual GPU validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu:
    # Maintainer-controlled NVIDIA Linux runner, never triggered by fork PRs.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[torch,triton,jax,dev]'
      - run: python -m common.python.environment
      - run: pytest -m gpu --require-gpu-backends -q
      - run: python -m benchmarks.run_all --config benchmarks/configs/smoke.json --require-all --output artifacts/gpu-${{ github.run_id }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-measurements-${{ github.run_id }}
          path: artifacts/
