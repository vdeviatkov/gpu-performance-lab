[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-performance-lab"
version = "0.1.0"
description = "Reproducible GPU kernel engineering experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.6,<3"]
triton = ["triton>=3.2,<4; sys_platform == 'linux'"]
jax = ["jax[cuda12]>=0.5,<1; sys_platform == 'linux'"]
dev = ["pytest>=8,<10", "ruff==0.15.6", "build>=1,<2", "ninja>=1.11", "pre-commit>=4,<5"]

[project.scripts]
gpu-lab-bench = "benchmarks.run_all:main"
gpu-lab-report = "benchmarks.report:main"
gpu-lab-env = "common.python.environment:main"

[tool.setuptools.packages.find]
include = ["common*", "benchmarks*", "kernels*"]

[tool.setuptools.package-data]
"*" = ["*.cu", "*.cpp", "*.cuh", "*.json", "*.md", "CMakeLists.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "kernels"]
python_files = ["test_*.py", "test.py"]
addopts = "--import-mode=importlib -ra"
markers = ["gpu: requires NVIDIA CUDA GPU", "jax: requires JAX"]
